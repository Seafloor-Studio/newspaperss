name: Release

# A tag like v0.1.0 builds the signed APK and the AAB for Google Play and attaches them to a
# draft GitHub release, to check before publishing. F-Droid builds the app itself from the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs plugins and dependencies' code: it gets no token to push with.
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          # No Gradle cache here. A cache entry written by a less-trusted run could be restored
          # into the build that gets signed, and a release is rare enough not to need the minute.
      # A tag that doesn't match versionName would publish one version under another's name.
      - name: Check the tag matches the app's version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts"
            exit 1
          fi
      # F-Droid reads each APK's changelog by that APK's version code, versionCode * 10 + 1 to 4.
      - name: Check the changelog and its F-Droid copies
        run: |
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          dir=fastlane/metadata/android/en-US/changelogs
          for n in 1 2 3 4; do
            if [ ! -f "$dir/$code.txt" ] || ! cmp -s "$dir/$code.txt" "$dir/$code$n.txt"; then
              echo "::error::$dir needs $code.txt and identical copies $code""1.txt to $code""4.txt (see docs/RELEASING.md)"
              exit 1
            fi
          done
      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 isn't set: add the release signing secrets (see docs/RELEASING.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      # main's CI already ran the tests on this commit; this builds only what's shipped. The two
      # Kokoro checks run here as well as in main's CI, because these are the bytes that get signed
      # and go out: a tag can sit on a commit main's CI never finished, and the natural voice's
      # 32 MB coming back is invisible on screen (see KokoroNativeLibsCheck in app/build.gradle.kts).
      - name: Build the signed APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease checkReleaseKokoroNativeLibs checkReleaseKokoroBundle
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          aab="NewspapeRSS-${tag#v}.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$aab"
          # One APK per ABI (see splits in app/build.gradle.kts). A missing one fails the step rather than going out short.
          apks=()
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            apk="NewspapeRSS-${tag#v}-$abi.apk"
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "$apk"
            apks+=("$apk")
          done
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          notes="fastlane/metadata/android/en-US/changelogs/$code.txt"
          gh release create "$tag" "${apks[@]}" "$aab" --draft --verify-tag --title "NewspapeRSS ${tag#v}" --notes-file "$notes"
