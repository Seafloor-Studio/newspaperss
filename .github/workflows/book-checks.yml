name: Book checks

# Ace by DAISY on the books EpubCheckTest writes from the platform corpus. epubcheck itself runs
# in the unit tests; Ace needs Node and a browser, so it runs here, on changes to what goes into
# the book.
on:
  pull_request:
    paths:
      - 'core/src/main/kotlin/**/epub/**'
      - 'core/src/main/kotlin/**/extract/**'
      - 'core/src/main/kotlin/**/images/**'
      - 'core/src/main/kotlin/**/ReadingTime.kt'
      - 'core/src/test/kotlin/**/epub/EpubCheckTest.kt'
      - 'core/src/test/kotlin/**/extract/PlatformCorpusTest.kt'
      - 'core/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradle/verification-metadata.xml'
      - 'core/src/test/resources/platforms/**'
      - 'tools/ace-check.sh'
      - '.github/workflows/book-checks.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      # --rerun: the books are a side effect Gradle doesn't know about, so a test result restored
      # from its cache leaves none to check.
      - name: Write the books
        run: ./gradlew :core:test --tests '*EpubCheckTest*' --rerun
      - name: Ace by DAISY
        run: tools/ace-check.sh
      - name: Keep Ace's reports when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ace-reports
          path: core/build/ace/
