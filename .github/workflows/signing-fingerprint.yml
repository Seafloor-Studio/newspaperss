# Prints the SHA-256 of the release signing certificate held in this repo's secrets, for the
# F-Droid recipe's AllowedAPKSigningKeys. Read it here rather than from a copy of the keystore:
# the secret is what signs releases, and a mismatch only shows once F-Droid rejects a tagged
# release. The fingerprint is public certificate data; the key and passwords never leave the job.
name: Signing fingerprint

on:
  workflow_dispatch:

permissions: {}

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print the release certificate's SHA-256
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 isn't set (see docs/RELEASING.md)"
            exit 1
          fi
          jks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$jks"' EXIT
          echo "$KEYSTORE_BASE64" | base64 --decode > "$jks"
          sha=$(keytool -list -v -keystore "$jks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$sha" ]; then
            echo "::error::No SHA-256 found for alias $KEY_ALIAS"
            exit 1
          fi
          echo "AllowedAPKSigningKeys: $sha"
          echo "AllowedAPKSigningKeys: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
