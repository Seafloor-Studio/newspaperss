name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # A PR opened against another branch (one stacked on another PR) is filtered out by
    # branches above, so it never builds. Retargeting it to main arrives as `edited`, not as
    # one of the default types, so without this it still never builds and the PR shows every
    # other check green with the suite never run against it. Closing and reopening doesn't
    # start it either.
    types: [opened, synchronize, reopened, edited]
  # dependency-verification.yml starts it again on a Dependabot branch after pushing checksums.
  workflow_dispatch:

# Read-only unless a job asks for more; the build runs third-party plugins and dependencies.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # `edited` also fires on every title and description edit, which has no bearing on the
    # build: only a changed base branch does.
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    # A build takes about four minutes; a hung test would otherwise hold a PR for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs plugins and dependencies' code: it gets no token to push with.
          persist-credentials: false
          # Changed-line coverage diffs against the base branch, which needs a merge base.
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      # gradle-wrapper.jar is the first code ./gradlew runs, and a PR that swaps it shows only a
      # binary diff. This checks it against Gradle's published checksums before it runs.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build, unit tests and coverage
        run: ./gradlew build koverXmlReport koverHtmlReport koverVerify
      - name: Coverage of the lines this branch changed
        if: github.event_name == 'pull_request'
        # diff-cover, as rss-to-e-reader uses: one tool rather than one of ours to maintain.
        # --src-roots is needed because kover names packages, not paths, so without it every
        # diff reads as "no lines with coverage information" and the check can never fail.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Without pipefail the exit code below comes from tee, and a coverage failure passes.
          set -o pipefail
          pipx install diff-cover==10.6.0 || pip install --quiet diff-cover==10.6.0
          roots="app/src/main/java core/src/main/kotlin"
          # Below 20 changed lines the percentage describes the denominator, not the tests: one
          # uncovered default argument in a four-line diff is 75%. Reported, not enforced.
          # Counted under the same roots: diff-cover sees nothing else, so lines elsewhere (debug
          # builds' own code) would read as "matched none of them" below.
          changed=$(git diff --numstat "origin/$BASE_REF...HEAD" -- 'app/src/main/java/*.kt' 'core/src/main/kotlin/*.kt' \
            | awk '{ s += $1 } END { print s + 0 }')
          if [ "${changed:-0}" -lt 20 ]; then
            echo "Under 20 changed Kotlin lines outside tests: reporting without enforcing."
            diff-cover build/reports/kover/report.xml --compare-branch="origin/$BASE_REF" --src-roots $roots || true
          else
            diff-cover build/reports/kover/report.xml --compare-branch="origin/$BASE_REF" \
              --src-roots $roots --fail-under=80 | tee /tmp/diffcover.txt
            # Kover names packages, not paths. If --src-roots ever stops matching, diff-cover
            # finds nothing and passes everything: a check that cannot fail. With this many
            # changed lines it should have found some, so say so rather than go quiet.
            if grep -q "No lines with coverage information" /tmp/diffcover.txt; then
              echo "::error::$changed Kotlin lines changed but diff-cover matched none of them. --src-roots is probably wrong for this layout."
              exit 1
            fi
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newspaperss-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
            build/reports/kover/
          retention-days: 14

  # A fixed link to the newest build from main, for installing on a phone:
  # https://github.com/Seafloor-Studio/newspaperss/releases/download/latest-debug/newspapeRSS-debug.apk
  # Its own job so only these few lines, not the build and its dependencies, get a token that can write.
  publish-debug:
    needs: build
    # Not on a re-run: an older run's number is a lower version code, which phones that
    # already have a newer build can't install.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time. Cancelling the older run isn't enough: cancellation isn't instant, so two
    # jobs overlap long enough to collide on the same release's assets, which is what the 403s
    # in #210 were. A later push waits and then publishes, so the newest build is the one left.
    concurrency:
      group: latest-debug
      cancel-in-progress: false
    steps:
      # Every tester's build offers to install each new one, so a merge of docs, tests or tooling
      # alone isn't published: it would be the same app with a higher number. Compared with the
      # last published build, not the last merge, so skipped merges' changes go out with the next
      # one. Anything it can't tell is published: a spare build costs less than a missing one.
      - name: Anything changed in the app since the last published build?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          published=$(gh api "repos/$GH_REPO/git/ref/tags/latest-debug" --jq .object.sha 2>/dev/null || true)
          files=""
          if [ -n "$published" ] && [ "$published" != "$GITHUB_SHA" ]; then
            # The compare API lists at most 300 files: past that, publish.
            files=$(gh api "repos/$GH_REPO/compare/$published...$GITHUB_SHA" \
              --jq 'if (.files | length) >= 300 then "too many" else (.files[] | .filename, (.previous_filename // empty)) end' 2>/dev/null || true)
          fi
          if [ -z "$files" ] || [ "$files" = "too many" ]; then
            echo "Can't tell what changed since ${published:-no build}: publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Paths that never reach the APK. This workflow does: it signs it.
          outside='^(docs/|tools/|epubsink/|\.claude/|fastlane/|[^/]*\.md$|app/src/(test|testDebug|androidTest|sharedTest)/|core/src/test/|gradle/verification-metadata\.xml$|\.github/)'
          app=$(printf '%s\n' "$files" | { grep -vE "$outside" || true; }
            printf '%s\n' "$files" | { grep -xF '.github/workflows/build-and-test.yml' || true; })
          if [ -z "$app" ]; then
            echo "Nothing in the app changed since ${published:0:7}: not publishing. Changed:"
            printf '%s\n' "$files" | sed 's/^/  /'
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed in the app since ${published:0:7}:"
            printf '%s\n' "$app" | sed 's/^/  /'
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.changed.outputs.publish == 'true'
        with:
          name: newspaperss-debug-apk
      # The shared debug key, which signed every build testers have: the new key's rotation names it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changed.outputs.publish == 'true'
        with:
          persist-credentials: false
          sparse-checkout: app/debug.keystore
          sparse-checkout-cone-mode: false
          path: repo
      # The committed debug key is public, so the updater's signature check could only prove a
      # file was a debug build. Published builds are signed again with a key held here, rotated
      # from the shared one so a tester's build updates in place (Android 9 and later; Android 8
      # still sees the shared key). Until its secrets exist, they go out as built. Here rather than
      # in the build, which runs plugins' and dependencies' code and every PR's.
      - name: Sign with the debug channel's own key
        id: sign
        if: steps.changed.outputs.publish == 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret: publishing builds signed with the committed debug key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/debug-channel.jks"
          lineage="$RUNNER_TEMP/debug-lineage"
          trap 'rm -f "$keystore" "$lineage"' EXIT
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$keystore"
          # The newest released build-tools: sort -V puts a preview (37.0.0-rc1) above them.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | grep -v -- '-rc' | sort -V | tail -1)/apksigner"
          shared=(--ks repo/app/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android)
          own=(--ks "$keystore" --ks-key-alias "$DEBUG_KEY_ALIAS" --ks-pass env:DEBUG_KEYSTORE_PASSWORD --key-pass env:DEBUG_KEY_PASSWORD)
          "$apksigner" rotate --out "$lineage" --old-signer "${shared[@]}" --new-signer "${own[@]}"
          for apk in app-*-debug.apk; do
            "$apksigner" sign "${shared[@]}" --next-signer "${own[@]}" --lineage "$lineage" \
              --rotation-min-sdk-version 28 --v1-signing-enabled false --v4-signing-enabled false "$apk"
            # Android 9 and later see one signer, the channel's key, with the shared one in its
            # lineage; Android 8 the shared key, from the v2 signature plain verify checks too.
            # The channel key's digest in the log, to compare against.
            out=$("$apksigner" verify -v --print-certs "$apk")
            grep -qx 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$out"
            grep -qx 'Number of signers: 1' <<< "$out"
            grep 'certificate SHA-256 digest' <<< "$out" | grep -v 2013e64d5fcee3f9738a097f809ae3965e94aca6471cbd2a10bdc8e76974d5b5
            "$apksigner" verify --print-certs --max-sdk-version 27 "$apk" | grep -q 2013e64d5fcee3f9738a097f809ae3965e94aca6471cbd2a10bdc8e76974d5b5
            # Rollback would let any build signed with the public shared key replace this one.
            chain=$("$apksigner" lineage --in "$apk" --print-certs -v)
            grep -q 2013e64d5fcee3f9738a097f809ae3965e94aca6471cbd2a10bdc8e76974d5b5 <<< "$chain"
            if grep -q 'Has rollback capability *: true' <<< "$chain"; then echo "::error::$apk's lineage allows rollback"; exit 1; fi
          done
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Update the latest-debug release
        if: steps.changed.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          # One APK per ABI. The fixed link is arm64's, which phones and recent e-readers run;
          # the others keep their ABI in the name.
          for abi in armeabi-v7a x86 x86_64; do mv "app-$abi-debug.apk" "newspapeRSS-debug-$abi.apk"; done
          mv app-arm64-v8a-debug.apk newspapeRSS-debug.apk
          build="${{ github.run_number }}"
          short="${GITHUB_SHA::7}"
          # The same build under a numbered name, so a download can't be mistaken for an older one.
          numbered="newspapeRSS-debug-$build.apk"
          cp newspapeRSS-debug.apk "$numbered"
          title="Debug build $build · $short · $(date -u '+%b %-d')"
          notes="Build $build from main ($short), $(date -u '+%Y-%m-%d %H:%M') UTC. Installs beside a release build as com.app.newspaperss.debug; its version is 0.1.0-debug.$build+$short (Settings, at the bottom). newspapeRSS-debug.apk is for arm64, most phones and e-readers; an older 32-bit e-reader needs the armeabi-v7a one, which has no podcast voice."
          if [ "$SIGNED" = true ]; then
            notes="$notes Signed with the debug channel's own key, rotated from the shared one, so a test build from before updates in place. On Android 9 and later, a build made with installDebug can't then go over it: uninstall first; editions and settings go with it. Android 8 still sees the shared key."
          fi
          # Updated in place, so the fixed link never 404s between builds. Title, notes and tag
          # follow each build: otherwise the page keeps the first build's date and commit.
          if gh release view latest-debug > /dev/null 2>&1; then
            gh release upload latest-debug newspapeRSS-debug.apk newspapeRSS-debug-armeabi-v7a.apk newspapeRSS-debug-x86.apk newspapeRSS-debug-x86_64.apk "$numbered" --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest-debug" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit latest-debug --title "$title" --notes "$notes"
            # Only the newest numbered copy stays.
            gh release view latest-debug --json assets --jq '.assets[].name' \
              | { grep -E '^newspapeRSS-debug-[0-9]+\.apk$' || true; } | { grep -vx "$numbered" || true; } \
              | while read -r old; do gh release delete-asset latest-debug "$old" -y; done
          else
            gh release create latest-debug newspapeRSS-debug.apk newspapeRSS-debug-armeabi-v7a.apk newspapeRSS-debug-x86.apk newspapeRSS-debug-x86_64.apk "$numbered" --prerelease --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes"
          fi
