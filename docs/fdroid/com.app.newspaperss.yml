Builds:
  - versionName: 0.1.1
    versionCode: 21
    commit: 1fdaff2ba48977a9252edcf71423e40efc47e824
    subdir: app
    sudo:
      - export CPUS_MAX=16
      - export CPUS=$(getconf _NPROCESSORS_ONLN)
      - for (( c=$CPUS_MAX; c<$CPUS; c++ )) ; do echo 0 > /sys/devices/system/cpu/cpu$c/online
        ; done
    gradle:
      - yes
    output: build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    binary: https://github.com/Seafloor-Studio/newspaperss/releases/download/v%v/NewspapeRSS-%v-armeabi-v7a.apk

