# Draft of metadata/com.app.newspaperss.yml for a merge request to
# https://gitlab.com/fdroid/fdroiddata (see docs/RELEASING.md). Not read by
# anything in this repository.
# As SherpaTTS, the other sherpa-onnx app on F-Droid: the podcast's voice comes from Hugging Face.
AntiFeatures:
  NonFreeNet:
    en-US: Downloads the podcast voice (Kokoro) from Hugging Face
Categories:
  - Reading
License: MIT
AuthorName: madCode
SourceCode: https://github.com/madCode/newspaperss
IssueTracker: https://github.com/madCode/newspaperss/issues
Changelog: https://github.com/madCode/newspaperss/releases

AutoName: NewspapeRSS

RepoType: git
Repo: https://github.com/madCode/newspaperss.git

# One APK per ABI, as the app's build splits them: version code versionCode * 10 + 1 to 4
# (armeabi-v7a, arm64-v8a, x86, x86_64), so a device is offered the highest it can run.
Builds:
  - versionName: 0.1.0
    versionCode: 11
    commit: v0.1.0
    subdir: app
    gradle:
      - yes
    output: build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
  - versionName: 0.1.0
    versionCode: 12
    commit: v0.1.0
    subdir: app
    gradle:
      - yes
    output: build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
  - versionName: 0.1.0
    versionCode: 13
    commit: v0.1.0
    subdir: app
    gradle:
      - yes
    output: build/outputs/apk/release/app-x86-release-unsigned.apk
  - versionName: 0.1.0
    versionCode: 14
    commit: v0.1.0
    subdir: app
    gradle:
      - yes
    output: build/outputs/apk/release/app-x86_64-release-unsigned.apk

AutoUpdateMode: Version
VercodeOperation:
  - 10*%c+1
  - 10*%c+2
  - 10*%c+3
  - 10*%c+4
# Only real releases: latest-debug is a tag too, moved on every merge to main.
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.1.0
CurrentVersionCode: 14
